# Локальный или стендовый запуск: docker compose -f deploy/docker/compose.yaml up --build
# Токены задать в .env рядом с файлом или в окружении (Coolify — в настройках сервиса).
services:
  emulkon:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: emulkon:dev
    ports:
      - "8737:8737"
    environment:
      EMULKON_DEVICE_TOKEN: ${EMULKON_DEVICE_TOKEN:?задайте токен устройств}
      EMULKON_CONTROL_TOKEN: ${EMULKON_CONTROL_TOKEN:?задайте токен Control API}
      EMULKON_LOG_LEVEL: info
    volumes:
      - emulkon-data:/data
    restart: unless-stopped

volumes:
  emulkon-data:
