name: Предложение
description: Новое устройство, метод, сценарий сбоя или удобство
labels: [предложение]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу решаем
      description: Что вы тестируете в 1С и чего не хватает
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Как это могло бы выглядеть
  - type: textarea
    id: bpo
    attributes:
      label: Требования БПО
      description: Метод, параметры, коды ошибок из требований к драйверам — если речь о поведении устройства
