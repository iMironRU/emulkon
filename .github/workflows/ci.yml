name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Сервер — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Не отформатировано gofmt:"; echo "$unformatted"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  linux-driver:
    name: Linux — драйвер (.so)
    runs-on: ubuntu-latest
    # manylinux_2_28 (AlmaLinux 8, glibc 2.28, GCC из gcc-toolset): собранная здесь библиотека работает на
    # Astra 1.7, РЕД ОС, Альт, Ubuntu 20.04 и новее. Debian 11 не годится: его security-архив снят.
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Инструменты сборки
        run: |
          dnf install -y -q unzip git binutils libuuid-devel > /dev/null  # uuid/uuid.h — для com.h из SDK 1С
          # CMake — официальная сборка Kitware с проверкой SHA-256: версия не зависит от образа.
          v=3.30.5
          cd /tmp
          curl -fsSLO "https://github.com/Kitware/CMake/releases/download/v$v/cmake-$v-linux-x86_64.tar.gz"
          curl -fsSLO "https://github.com/Kitware/CMake/releases/download/v$v/cmake-$v-SHA-256.txt"
          grep "cmake-$v-linux-x86_64.tar.gz" "cmake-$v-SHA-256.txt" | sha256sum -c -
          tar -xzf "cmake-$v-linux-x86_64.tar.gz" -C /opt
          ln -sf "/opt/cmake-$v-linux-x86_64/bin/"* /usr/local/bin/
          cmake --version | head -n 1
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: Сборка и тесты
        env:
          ONEC_SDK_B64: ${{ secrets.ONEC_SDK_B64 }}
        run: bash .github/scripts/linux-driver.sh
      - name: Драйвер Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-driver
          path: dist-linux/
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows — драйвер, трей, консоль, установщик
    runs-on: windows-2022
    needs: linux-driver  # драйвер Linux — в общий пакет и установщик
    steps:
      - uses: actions/checkout@v4
      - name: Драйвер Linux из задачи linux-driver
        uses: actions/download-artifact@v4
        continue-on-error: true  # нет SDK 1С (pull request из форка) — пакета Linux нет
        with:
          name: linux-driver
          path: dist-linux
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: Тулчейн C++ (clang-cl, MSVC и Windows SDK раннера)
        shell: pwsh
        run: .github/scripts/ci-env.ps1
      - name: SDK Native API 1С
        shell: pwsh
        env:
          ONEC_SDK_B64: ${{ secrets.ONEC_SDK_B64 }}
        run: .github/scripts/onec-sdk.ps1
      - name: Сборка и тесты — всё
        if: env.HAVE_ONEC_SDK == '1'
        shell: powershell
        run: |
          $so = "dist-linux\libEmulkonDriver_lin64.so"
          if (Test-Path $so) { .\build.ps1 -LinuxDriver $so } else { .\build.ps1 }
      - name: Сборка и тесты — без драйвера (нет SDK 1С)
        if: env.HAVE_ONEC_SDK != '1'
        shell: powershell
        run: |
          .\tray\build.ps1
          .\console\build.ps1
      - name: Дистрибутив
        if: env.HAVE_ONEC_SDK == '1'
        uses: actions/upload-artifact@v4
        with:
          name: emulkon-${{ github.sha }}
          path: |
            dist/downloads/*
          retention-days: 14
          if-no-files-found: error
