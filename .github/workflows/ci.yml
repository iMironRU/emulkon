name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Сервер — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Не отформатировано gofmt:"; echo "$unformatted"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: vmtool (ВМ для проверки под Linux)
        working-directory: tests/linux/vmtool
        run: |
          go vet ./...
          go test ./...

  linux-driver:
    name: Linux — драйвер (.so)
    runs-on: ubuntu-latest
    # manylinux_2_28 (AlmaLinux 8, glibc 2.28, GCC из gcc-toolset): собранная здесь библиотека работает на
    # Astra 1.7, РЕД ОС, Альт, Ubuntu 20.04 и новее. Debian 11 не годится: его security-архив снят.
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Инструменты сборки
        run: |
          dnf install -y -q unzip git binutils libuuid-devel > /dev/null  # uuid/uuid.h — для com.h из SDK 1С
          # CMake — официальная сборка Kitware с проверкой SHA-256: версия не зависит от образа.
          v=3.30.5
          cd /tmp
          curl -fsSLO "https://github.com/Kitware/CMake/releases/download/v$v/cmake-$v-linux-x86_64.tar.gz"
          curl -fsSLO "https://github.com/Kitware/CMake/releases/download/v$v/cmake-$v-SHA-256.txt"
          grep "cmake-$v-linux-x86_64.tar.gz" "cmake-$v-SHA-256.txt" | sha256sum -c -
          tar -xzf "cmake-$v-linux-x86_64.tar.gz" -C /opt
          ln -sf "/opt/cmake-$v-linux-x86_64/bin/"* /usr/local/bin/
          cmake --version | head -n 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: Сборка и тесты
        env:
          ONEC_SDK_B64: ${{ secrets.ONEC_SDK_B64 }}
        run: bash .github/scripts/linux-driver.sh
      - name: Драйвер Linux
        uses: actions/upload-artifact@v7
        with:
          name: linux-driver
          path: dist-linux/
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows — драйвер, трей, консоль, установщик
    runs-on: windows-2022
    needs: linux-driver  # драйвер Linux — в общий пакет и установщик
    steps:
      - uses: actions/checkout@v7
      - name: Драйвер Linux из задачи linux-driver
        uses: actions/download-artifact@v4
        continue-on-error: true  # нет SDK 1С (pull request из форка) — пакета Linux нет
        with:
          name: linux-driver
          path: dist-linux
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: Тулчейн C++ (clang-cl, MSVC и Windows SDK раннера)
        shell: pwsh
        run: .github/scripts/ci-env.ps1
      - name: SDK Native API 1С
        shell: pwsh
        env:
          ONEC_SDK_B64: ${{ secrets.ONEC_SDK_B64 }}
        run: .github/scripts/onec-sdk.ps1
      - name: Сборка и тесты — всё
        if: env.HAVE_ONEC_SDK == '1'
        shell: powershell
        run: |
          $so = "dist-linux\libEmulkonDriver_lin64.so"
          if (Test-Path $so) { .\build.ps1 -LinuxDriver $so } else { .\build.ps1 }
      - name: Сборка и тесты — без драйвера (нет SDK 1С)
        if: env.HAVE_ONEC_SDK != '1'
        shell: powershell
        run: |
          .\tray\build.ps1
          .\console\build.ps1
      - name: Дистрибутив
        if: env.HAVE_ONEC_SDK == '1'
        uses: actions/upload-artifact@v7
        with:
          name: emulkon-${{ github.sha }}
          path: |
            dist/downloads/*
          retention-days: 14
          if-no-files-found: error
      - name: Пакеты сервера Linux (.deb, .rpm)
        shell: powershell
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          if (Test-Path "dist\downloads\EmulkonDriver_${v}_lin64.so") { .\deploy\linux\package.ps1 } else { .\deploy\linux\package.ps1 -NoDriver }
      - name: Пакеты Linux
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: dist/linux/*
          retention-days: 14
          if-no-files-found: error

  linux-package:
    name: Linux — пакет сервера (установка)
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkg
      - name: .deb — установка, служба systemd, удаление
        run: |
          sudo apt-get install -y -qq ./pkg/emulkon_*_amd64.deb
          systemctl is-active emulkon
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8737/api/v1/health > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8737/api/v1/health; echo
          curl -fsS http://127.0.0.1:8737/api/v1/downloads | head -c 800; echo
          test "$(sudo stat -c '%a %U' /etc/emulkon/emulkon.env)" = "600 root"
          sudo journalctl -u emulkon --no-pager | tail -n 20
          sudo apt-get remove -y -qq emulkon
          if systemctl is-active --quiet emulkon; then echo "служба осталась после удаления"; exit 1; fi
      - name: .rpm — установка в Rocky Linux 9
        run: |
          docker run --rm -v "$PWD/pkg:/pkg:ro" rockylinux:9 sh -ec '
            rpm -i /pkg/emulkon-*.x86_64.rpm
            emulkon -version
            rpm -V emulkon
            rpm -e emulkon'
